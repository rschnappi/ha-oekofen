# ÖkOfen Pellematic Dashboard
# Kopiere diese Datei in ein neues Home-Assistant-Dashboard (Rohes YAML
# bearbeiten) oder als Ausgangspunkt für ein eigenes Dashboard.
#
# WICHTIG ZU DEN ENTITY-IDs:
# Seit v0.6.0/v0.8.0 sind praktisch alle Werte native number/select/switch/
# climate/time/datetime/text-Entities (kein input_number/input_select-Umweg
# mehr nötig). Home Assistant leitet die Entity-ID aus dem Gerätenamen +
# dem zugewiesenen Bereich ab, NICHT (mehr) aus Host/IP - ein paar sehr
# alte sensor.*-Entities aus Zeiten vor v0.6.0 können bei dir noch
# host-basierte IDs haben (z.B. "sensor.okofen_192_168_1_50_..."), falls du
# seither nie neu eingerichtet hast.
#
# Der Regelfall bei einer (Neu-)Einrichtung: die Entity-ID setzt sich aus
# Bereich + Gerätename + Entity-Bezeichnung zusammen, z.B.
# "select.heizraum_ofen_anlage_betriebsart", wenn das Gerät im Bereich
# "Heizraum" liegt und in Einstellungen -> Geräte & Dienste -> Geräte auf
# "Ofen" umbenannt wurde (Standardname ohne Umbenennung: "ÖkOfen <IP>").
# Änderst du den Gerätenamen nachträglich, bekommen davon nur NEU
# angelegte Entities die neue Bezeichnung - bereits registrierte
# Entity-IDs bleiben stabil.
#
# In dieser Vorlage steht überall der Platzhalter PRAEFIX für den
# Bereich+Gerätename-Teil der Entity-ID (z.B. "heizraum_ofen"). Ersetze ihn
# per Suchen & Ersetzen durch das, was du in deiner Entitätenliste
# tatsächlich siehst:
#   Einstellungen -> Geräte & Dienste -> Entitäten -> nach "okofen"/deinem
#   Gerätenamen suchen
#
# Diese Vorlage bildet 8 Ansichten ab, an einer realen Anlage erprobt:
# Übersicht, Pellematic, Heizkreis, Warmwasser, Puffer & Pumpen, Statistik,
# Zeitprogramme, Einstellungen. Sie deckt Heizkreis 1 und Warmwasser 1 ab -
# für weitere Kreise (2, 3, ...) die jeweiligen Blöcke duplizieren und die
# Ziffer entsprechend anpassen. Die Zeitprogramme-Ansicht enthält bewusst
# nur Zeit 1 + Zeit 2, Block 1 pro Kreis als Beispiel (das Gerät hat bis zu
# 3 Blöcke x 7 Tage x 2 Zeitprogramme x N Kreise an time-Entities - alle
# aufzulisten wäre unübersichtlich); dupliziere die vertical-stack-Blöcke
# nach demselben Muster für weitere Blöcke/Zeitprogramme.
#
# Felder mit Warnzeichen im Namen (number.*/select.* mit installateur-
# gesperrten Originalwerten) tragen zusätzlich ein "warnhinweis"-Attribut,
# sichtbar im Mehr-Info-Dialog der Entity - siehe README, Abschnitt
# "Installateur-Ebene-Felder".

